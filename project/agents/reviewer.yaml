name: "agent-c"
role: "reviewer"
description: "Static code review, readability, maintainability, design consistency, and architecture"

permissions:
  read:
    - "project"
  write:
    - "review_reports"

allowed_commands:
  - "git"
  - "cat"
  - "ls"
  - "grep"
  - "find"
  - "flake8"
  - "clippy"
