services:
  manager:
    build:
      context: .
      dockerfile: containers/developer/Dockerfile
    container_name: mag-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - agy-manager-state:/agent-state
    command: ["python3", "-m", "project.src.cli", "start-server"]
    depends_on:
      - agent-a
      - agent-b
      - agent-c
      - agent-d
      - agent-e

  agent-a:
    build:
      context: .
      dockerfile: containers/developer/Dockerfile
    container_name: mag-agent-a
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace
      - agy-dev-auth:/home/agent-a/.gemini/antigravity-cli
      - agy-dev-state:/agent-state
    command: ["python3", "-m", "project.src.worker.server", "--agent-id", "agent-a", "--role", "developer", "--port", "8001"]

  agent-b:
    build:
      context: .
      dockerfile: containers/tester/Dockerfile
    container_name: mag-agent-b
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - .:/workspace
      - agy-tester-auth:/home/agent-b/.gemini/antigravity-cli
      - agy-tester-state:/agent-state
    command: ["python3", "-m", "project.src.worker.server", "--agent-id", "agent-b", "--role", "tester", "--port", "8002"]

  agent-c:
    build:
      context: .
      dockerfile: containers/reviewer/Dockerfile
    container_name: mag-agent-c
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - .:/workspace
      - agy-reviewer-auth:/home/agent-c/.gemini/antigravity-cli
      - agy-reviewer-state:/agent-state
    command: ["python3", "-m", "project.src.worker.server", "--agent-id", "agent-c", "--role", "reviewer", "--port", "8003"]

  agent-d:
    build:
      context: .
      dockerfile: containers/security/Dockerfile
    container_name: mag-agent-d
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      - .:/workspace
      - agy-security-auth:/home/agent-d/.gemini/antigravity-cli
      - agy-security-state:/agent-state
    command: ["python3", "-m", "project.src.worker.server", "--agent-id", "agent-d", "--role", "security", "--port", "8004"]

  agent-e:
    build:
      context: .
      dockerfile: containers/researcher/Dockerfile
    container_name: mag-agent-e
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - .:/workspace
      - agy-research-auth:/home/agent-e/.gemini/antigravity-cli
      - agy-research-state:/agent-state
    command: ["python3", "-m", "project.src.worker.server", "--agent-id", "agent-e", "--role", "researcher", "--port", "8005"]

volumes:
  agy-manager-state:
  agy-dev-auth:
  agy-dev-state:
  agy-tester-auth:
  agy-tester-state:
  agy-reviewer-auth:
  agy-reviewer-state:
  agy-security-auth:
  agy-security-state:
  agy-research-auth:
  agy-research-state:
